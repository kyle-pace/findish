name: Crawl
# The title says which sites a run reads, so another run can tell whether it would read the
# same ones (crawler/check-turn.mjs).
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.sources && format('Crawl: {0}', inputs.sources) || 'Crawl: all sites' }}"

# Weekly: check robots.txt, read sitemaps, fetch only new or changed recipe
# pages, refresh YouTube videos, and commit the data. Run by hand with a small
# limit to test. A push that changes the crawler runs a smoke test instead:
# 5 pages per site, nothing committed.
on:
  push:
    branches: [main]
    paths: ['crawler/**', 'vendor/kitchen-catalog/sources.json', '.github/workflows/crawl.yml', 'package*.json']
  schedule:
    - cron: '17 11 * * 1' # Mondays, 3:17 or 4:17 am Seattle time
  workflow_dispatch:
    inputs:
      limit:
        description: 'Most pages to fetch per site (empty for no limit)'
        required: false
        default: ''
      sources:
        description: 'Only these sources, comma separated (empty for all)'
        required: false
        default: ''
      commit:
        description: 'Commit the data'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

# Crawls of different sites can run side by side (since 2026-11-18): a hand-started crawl of
# named sources gets a group of its own, and everything else (the weekly run, a push's smoke
# test, a hand-started crawl of everything) shares one and waits its turn. The first step
# below stands a run down if another is already reading one of its sites.
concurrency:
  group: crawl-${{ github.event_name == 'workflow_dispatch' && inputs.sources || 'all' }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Is another crawl reading these sites?
        id: turn
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TITLE: "${{ github.event_name == 'workflow_dispatch' && inputs.sources && format('Crawl: {0}', inputs.sources) || 'Crawl: all sites' }}"
        run: node crawler/check-turn.mjs
      - run: npm ci
      - run: npm test
      - name: Crawl
        if: steps.turn.outputs.go == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LIMIT: ${{ github.event_name == 'push' && '5' || inputs.limit }}
          SOURCES: ${{ inputs.sources }}
        run: |
          args="--budget-minutes 300"
          [ -n "$LIMIT" ] && args="$args --limit $LIMIT"
          [ -n "$SOURCES" ] && args="$args --sources $SOURCES"
          [ "${{ github.event_name }}" = "push" ] && args="$args --sample 3"
          node crawler/crawl.mjs $args
      - name: Note this run's problems
        if: steps.turn.outputs.go == 'true'
        run: |
          node -e "const s=require('./data/status.json'); require('fs').writeFileSync(process.env.RUNNER_TEMP+'/alerts.txt', (s.alerts||[]).join('\n'))"
      - name: Commit the data
        if: steps.turn.outputs.go == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.commit))
        run: |
          git config user.name "recipe-search crawler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash crawler/save-crawl.sh
      - name: Report problems
        if: steps.turn.outputs.go == 'true'
        run: |
          if [ -s "$RUNNER_TEMP/alerts.txt" ]; then cat "$RUNNER_TEMP/alerts.txt"; exit 1; fi
