name: Explore

# Weekly: bring Explore's copy of the explorer up to date. kyle-pace/world-cuisines
# rebuilds its data from Wikipedia on Mondays at 13:17 UTC; a few hours later this copies
# the result into vendor/explore/ (scripts/sync-explore.mjs), fetches covers for any new
# cookbooks, builds the site to prove the copy still works, and commits. That push
# rebuilds the live site (Workers Builds).
#
# The sync refuses a thin copy (under 300 cuisines, or under five sixths of the pages
# here now) and the build fails if the explorer's pages changed shape, so a bad week
# turns this run red and leaves the copy that's live alone.
on:
  schedule:
    - cron: '23 18 * * 1' # Mondays, 10:23 or 11:23 am Seattle time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Its own queue: it only writes vendor/explore/ and public/covers/, which no other job touches.
  group: explore
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kyle-pace/world-cuisines
          path: .world-cuisines
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copy the explorer
        run: node scripts/sync-explore.mjs .world-cuisines
      - name: Fetch covers for new cookbooks
        run: npm run covers
      - name: Check the copy still builds and passes the tests
        run: |
          rm -rf .world-cuisines
          npm run build
          npm test
      - name: Commit
        run: |
          git config user.name "Findish explore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/explore public/covers
          # SOURCE.json names the commit copied, so it changes whenever that repo does.
          # Only commit when something the site serves changed.
          if ! git diff --cached --name-only | grep -qv '^vendor/explore/SOURCE.json$'; then
            echo "Nothing new from World cuisine this week."; exit 0
          fi
          git commit -m "Explore: this week's cuisines from World cuisine"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
