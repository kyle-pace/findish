<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for findish.now/creators/ and every creator page (public/og-creators.png).
   Render at 1200x630 (share-card skill), dark values from src/styles/theme.css.
   The shelf echoes the creator pages' bookshelf: plain cloth books on a tomato rule. */
@font-face{font-family:A;font-weight:400;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
html,body{margin:0}
body{position:relative;width:1200px;height:630px;background:#1d1714;color:#f1e6df;font-family:A;overflow:hidden;box-sizing:border-box;padding:96px 104px 0}
.site{font-size:30px;font-weight:700;color:#ff9f86;margin:0}
h1{font-size:88px;letter-spacing:-0.03em;line-height:1.02;margin:28px 0 0;max-width:820px}
p.line{font-size:34px;color:#b8a49b;margin:28px 0 0;max-width:640px;line-height:1.35}
.shelf{position:absolute;right:104px;bottom:96px;display:flex;align-items:flex-end;gap:10px;border-bottom:8px solid #ff9f86;padding:0 14px}
.b{width:44px;border:2px solid #7d6a61;border-bottom:0;border-radius:3px 3px 0 0;background:linear-gradient(#ff9f86,#ff9f86) 0 26px/100% 8px no-repeat,#251e1a}
.b:nth-child(2){width:58px;height:250px}.b:nth-child(1){height:212px}.b:nth-child(3){height:186px;width:38px}.b:nth-child(4){height:236px;width:52px}
.lean{height:200px;width:46px;transform:rotate(-14deg);transform-origin:bottom left;margin-left:14px}
</style></head><body>
<p class="site">findish.now/creators</p>
<h1>The people behind the recipes</h1>
<p class="line">Every creator Findish searches, and how to back them.</p>
<div class="shelf"><span class="b"></span><span class="b"></span><span class="b"></span><span class="b"></span><span class="b lean"></span></div>
</body></html>
