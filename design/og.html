<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for findish.now/ (public/og.png). Render at
   1200x630 (share-card skill). Dark values from src/styles/theme.css; it draws the
   page's own search box with an ingredient and a creator in it (design/PLAN.md). */
@font-face{font-family:A;font-weight:400;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
html,body{margin:0}
body{width:1200px;height:630px;background:#1d1714;color:#f1e6df;font-family:A;overflow:hidden;box-sizing:border-box;padding:64px 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.name{font-size:96px;font-weight:700;letter-spacing:-0.03em;line-height:1;margin:0}
.name{display:inline-flex;align-items:stretch;letter-spacing:-0.02em}
.d{display:flex;align-items:flex-end;padding:0 0.02em}
.d svg{display:block;width:0.507em;height:0.74em;margin-bottom:0.15em;color:#ff9f86}
.from{font-size:30px;color:#b8a49b;margin:36px 0 0}
.box{margin-top:56px;width:960px;box-sizing:border-box;display:flex;align-items:center;gap:16px;padding:18px 18px 18px 26px;border:3px solid #ff9f86;border-radius:12px;background:#251e1a;font-size:36px;text-align:left}
.tag{font-weight:700;background:#25331f;border-radius:7px;padding:8px 16px}
.creator{background:none;box-shadow:inset 0 0 0 3px #5a2c22}
.x{color:#b8a49b;font-weight:400;margin-left:10px}
.text{flex:1}
.go{width:66px;height:66px;border-radius:8px;background:#ff9f86;display:grid;place-items:center}
</style></head><body>
<p class="name"><span class="fin">fin</span><span class="d"><svg viewBox="0 0 52 76"><circle cx="25" cy="50" r="18.5" fill="none" stroke="currentColor" stroke-width="11"/><circle cx="25" cy="50" r="7" fill="currentColor" opacity="0.35"/><rect x="38" y="2" width="11" height="72" rx="5.5" fill="currentColor"/></svg></span><span class="ish">ish</span></p>

<div class="box"><span class="tag creator">from Hot Thai Kitchen<span class="x">×</span></span><span class="tag">ginger<span class="x">×</span></span><span class="text">curry</span>
<span class="go"><svg viewBox="0 0 24 24" width="34" height="34"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#1d1714" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="#1d1714" stroke-width="2.4" stroke-linecap="round"/></svg></span></div>
</body></html>
